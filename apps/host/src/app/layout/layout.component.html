<div class="bg-background text-on-background font-sans min-h-screen flex">
  
  <!-- Sidebar -->
  <aside 
    class="h-screen fixed left-0 top-0 bg-surface border-r border-outline-variant shadow-sm flex flex-col py-base z-40 transition-all duration-300 overflow-hidden"
    [ngClass]="{'w-[280px]': !isCollapsed, 'w-[80px]': isCollapsed}"
  >
    <lib-navigation [isCollapsed]="isCollapsed"></lib-navigation>
  </aside>

  <!-- Main Content Shell -->
  <div 
    class="min-h-screen flex flex-col transition-all duration-300 w-full" 
    [ngClass]="{'ml-[280px]': !isCollapsed, 'ml-[80px]': isCollapsed}"
  >
    <!-- Header -->
    <header class="h-16 fixed top-0 right-0 z-30 transition-all duration-300 w-full" [ngStyle]="{'left': isCollapsed ? '80px' : '280px', 'width': isCollapsed ? 'calc(100% - 80px)' : 'calc(100% - 280px)'}">
      <lib-header [isCollapsed]="isCollapsed" (toggleSidebar)="toggleSidebar()"></lib-header>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 mt-16 p-margin-desktop overflow-x-hidden">
      <!-- Router outlet for protected pages (Dashboard, etc.) -->
      <router-outlet></router-outlet>
    </main>
    
    <!-- Footer -->
    <footer class="w-full py-4 bg-surface-container border-t border-outline-variant flex justify-between items-center px-margin-desktop">
      <lib-footer></lib-footer>
    </footer>
  </div>
</div>
